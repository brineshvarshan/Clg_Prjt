apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-ecommerce-problem-3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/brineshvarshan/Clg_Prjt.git
    targetRevision: master
    path: problem-3/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
